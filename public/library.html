<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Library · QuizForge</title>
  <link
      rel="icon"
      type="image/png"
      href="logo.png"
    />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="aurora"></div>
  <div class="wrap">
    <nav>
      <a class="logo" href="/" aria-label="QuizForge home">
          <img src="logo.png" alt="QuizForge logo" />
          <span>QuizForge</span>
      </a>
      <div class="nav-links">
        <a href="/library">Library</a>
        <a href="/">New quiz</a>
      </div>
    </nav>

    <section class="section" style="margin-top:1rem">
      <h2>Quiz library</h2>
      <p class="sub">Explore recent quizzes and find a topic to practice.</p>
      <div class="library-controls">
        <label class="sr-only" for="librarySearch">Search quizzes</label>
        <input id="librarySearch" type="search" placeholder="Search titles or topics…" autocomplete="off" />
        <label class="sr-only" for="difficultyFilter">Filter by difficulty</label>
        <select id="difficultyFilter">
          <option value="all">All difficulties</option>
          <option value="easy">Warm-up</option>
          <option value="mixed">Balanced</option>
          <option value="hard">Advanced</option>
        </select>
      </div>
      <p id="libraryStatus" class="library-status" role="status" aria-live="polite">Loading quizzes…</p>
      <div class="recent-grid" id="libGrid"></div>
      <p id="empty" class="hidden library-status">
        No quizzes yet. <a href="/" style="color:#67e8f9">Forge one →</a>
      </p>
    </section>
  </div>
  <script src="/js/library.js"></script>
</body>
</html>
