<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login · QuizForge</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="aurora"></div>
    <div class="auth-wrap">
      <div class="glass glow-ring auth-card">
        <h1>Welcome back</h1>
        <p class="sub">Log in to forge quizzes</p>

        <div class="error-box hidden" id="errorBox" role="alert"></div>

        <form id="loginForm">
          <label for="email">Email</label>
          <div class="field">
            <input
              type="email"
              id="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
            />
          </div>

          <label for="password">Password</label>
          <div class="field">
            <input
              type="password"
              id="password"
              autocomplete="current-password"
              required
              minlength="10"
              maxlength="72"
              placeholder="Your password"
            />
            <button type="button" class="toggle-pass" data-target="password">
              Show
            </button>
          </div>

          <button type="submit" class="gen-btn">Log in</button>
        </form>

        <p class="switch">No account? <a href="/signup">Sign up</a></p>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
      if (Auth.getToken()) window.location.replace("/");

      const errorBox = document.getElementById("errorBox");
      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("hidden");
      }

      document.querySelectorAll(".toggle-pass").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = document.getElementById(btn.dataset.target);
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          btn.textContent = show ? "Hide" : "Show";
        });
      });

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          errorBox.classList.add("hidden");

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          try {
            const res = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Login failed");

            Auth.setAuth(data.token, data.user);
            window.location.replace("/");
          } catch (err) {
            showError(err.message || "Login failed");
          }
        });
    </script>
  </body>
</html>
