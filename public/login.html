<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login · QuizForge</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      .auth-wrap {
        max-width: 420px;
        margin: 4rem auto;
        padding: 0 1.25rem;
      }
      .auth-card {
        padding: 2rem;
      }
      .auth-card h1 {
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .auth-card p.sub {
        text-align: center;
        color: rgba(255, 255, 255, 0.55);
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
      }
      .auth-card label {
        display: block;
        font-size: 0.8rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 0.35rem;
      }
      .field {
        position: relative;
        margin-bottom: 1rem;
      }
      .auth-card input {
        width: 100%;
        padding: 0.85rem 2.75rem 0.85rem 1rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(0, 0, 0, 0.3);
        color: white;
        font-size: 0.95rem;
      }
      .auth-card input:focus {
        outline: none;
        border-color: #a78bfa;
      }
      .toggle-pass {
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.55);
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 700;
      }
      .switch {
        text-align: center;
        margin-top: 1.25rem;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.55);
      }
      .switch a {
        color: #67e8f9;
        text-decoration: none;
        font-weight: 700;
      }
      .error-box {
        margin-bottom: 1rem;
        color: #fb7185;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="aurora"></div>
    <div class="auth-wrap">
      <div class="glass glow-ring auth-card">
        <h1>Welcome back</h1>
        <p class="sub">Log in to forge quizzes</p>

        <div class="error-box hidden" id="errorBox"></div>

        <form id="loginForm">
          <label for="email">Email</label>
          <div class="field">
            <input
              type="email"
              id="email"
              required
              placeholder="you@example.com"
            />
          </div>

          <label for="password">Password</label>
          <div class="field">
            <input
              type="password"
              id="password"
              required
              minlength="10"
              placeholder="Your password"
            />
            <button type="button" class="toggle-pass" data-target="password">
              Show
            </button>
          </div>

          <button type="submit" class="gen-btn">Log in</button>
        </form>

        <p class="switch">No account? <a href="/signup">Sign up</a></p>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
      if (Auth.getToken()) window.location.replace("/");

      const errorBox = document.getElementById("errorBox");
      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("hidden");
      }

      document.querySelectorAll(".toggle-pass").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = document.getElementById(btn.dataset.target);
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          btn.textContent = show ? "Hide" : "Show";
        });
      });

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          errorBox.classList.add("hidden");

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          try {
            const res = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Login failed");

            Auth.setAuth(data.token, data.user);
            window.location.replace("/");
          } catch (err) {
            showError(err.message || "Login failed");
          }
        });
    </script>
  </body>
</html>
