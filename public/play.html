<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play · QuizForge</title>
  <link
      rel="icon"
      type="image/png"
      href="logo.png"
    />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="aurora"></div>
  <div class="wrap">
    <nav>

      <div class="nav-links">
        <a href="/library">Library</a>
        <a href="/">New quiz</a>

  <script src="/js/play.js"></script>
