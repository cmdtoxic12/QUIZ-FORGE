<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up · QuizForge</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="aurora"></div>
    <div class="auth-wrap">
      <div class="glass glow-ring auth-card">
        <h1>Create account</h1>
        <p class="sub">Start forging quizzes in seconds</p>

        <div class="error-box hidden" id="errorBox" role="alert"></div>

        <form id="signupForm">
          <label for="email">Email</label>
          <div class="field">
            <input
              type="email"
              id="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
            />
          </div>

          <label for="password">Password</label>
          <div class="field">
            <input
              type="password"
              id="password"
              autocomplete="new-password"
              required
              minlength="10"
              maxlength="72"
              placeholder="At least 10 characters"
            />
            <button type="button" class="toggle-pass" data-target="password">
              Show
            </button>
          </div>

          <ul class="reqs" role="status" aria-live="polite">
            <li id="req-len">At least 10 characters</li>
            <li id="req-bytes">No more than 72 UTF-8 bytes</li>
          </ul>

          <label for="confirm">Confirm password</label>
          <div class="field">
            <input
              type="password"
              id="confirm"
              autocomplete="new-password"
              required
              minlength="10"
              maxlength="72"
              placeholder="Re-enter password"
            />
            <button type="button" class="toggle-pass" data-target="confirm">
              Show
            </button>
          </div>
          <p class="match-msg" id="matchMsg" role="status" aria-live="polite">Passwords must match</p>

          <button type="submit" class="gen-btn" id="submitBtn" disabled>
            Sign up
          </button>
        </form>

        <p class="switch">
          Already have an account? <a href="/login">Log in</a>
        </p>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
      if (Auth.getToken()) window.location.replace("/");

      const errorBox = document.getElementById("errorBox");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirm");
      const matchMsg = document.getElementById("matchMsg");
      const submitBtn = document.getElementById("submitBtn");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("hidden");
      }

      document.querySelectorAll(".toggle-pass").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = document.getElementById(btn.dataset.target);
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          btn.textContent = show ? "Hide" : "Show";
        });
      });

      function validate() {
        const password = passwordInput.value;
        const confirm = confirmInput.value;

        const longEnough = password.length >= 10;
        const withinByteLimit = new TextEncoder().encode(password).length <= 72;
        document.getElementById("req-len").classList.toggle("ok", longEnough);
        document.getElementById("req-bytes").classList.toggle("ok", withinByteLimit);

        const matches = confirm.length > 0 && password === confirm;
        if (!confirm) {
          matchMsg.textContent = "Passwords must match";
          matchMsg.className = "match-msg";
        } else if (matches) {
          matchMsg.textContent = "Passwords match";
          matchMsg.className = "match-msg ok";
        } else {
          matchMsg.textContent = "Passwords do not match";
          matchMsg.className = "match-msg bad";
        }

        submitBtn.disabled = !(longEnough && withinByteLimit && matches);
        return longEnough && withinByteLimit && matches;
      }

      passwordInput.addEventListener("input", validate);
      confirmInput.addEventListener("input", validate);

      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          errorBox.classList.add("hidden");
          if (!validate()) return;

          const email = document.getElementById("email").value.trim();
          const password = passwordInput.value;

          try {
            const res = await fetch("/api/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Signup failed");

            Auth.setAuth(data.token, data.user);
            window.location.replace("/");
          } catch (err) {
            showError(err.message || "Signup failed");
          }
        });
    </script>
  </body>
</html>
