<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up · QuizForge</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      .auth-wrap {
        max-width: 420px;
        margin: 4rem auto;
        padding: 0 1.25rem;
      }
      .auth-card {
        padding: 2rem;
      }
      .auth-card h1 {
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .auth-card p.sub {
        text-align: center;
        color: rgba(255, 255, 255, 0.55);
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
      }
      .auth-card label {
        display: block;
        font-size: 0.8rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 0.35rem;
      }
      .field {
        position: relative;
        margin-bottom: 1rem;
      }
      .auth-card input {
        width: 100%;
        padding: 0.85rem 2.75rem 0.85rem 1rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(0, 0, 0, 0.3);
        color: white;
        font-size: 0.95rem;
      }
      .auth-card input:focus {
        outline: none;
        border-color: #a78bfa;
      }
      .toggle-pass {
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.55);
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 700;
      }
      .reqs {
        list-style: none;
        padding: 0;
        margin: 0 0 1rem;
        font-size: 0.8rem;
      }
      .reqs li {
        margin: 0.3rem 0;
        color: rgba(255, 255, 255, 0.45);
      }
      .reqs li.ok {
        color: #4ade80;
      }
      .reqs li.ok::before {
        content: "✓ ";
      }
      .reqs li:not(.ok)::before {
        content: "○ ";
      }
      .match-msg {
        font-size: 0.8rem;
        margin: -0.5rem 0 1rem;
        color: rgba(255, 255, 255, 0.45);
      }
      .match-msg.ok {
        color: #4ade80;
      }
      .match-msg.bad {
        color: #fb7185;
      }
      .switch {
        text-align: center;
        margin-top: 1.25rem;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.55);
      }
      .switch a {
        color: #67e8f9;
        text-decoration: none;
        font-weight: 700;
      }
      .error-box {
        margin-bottom: 1rem;
        color: #fb7185;
        font-size: 0.85rem;
      }
      .gen-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="aurora"></div>
    <div class="auth-wrap">
      <div class="glass glow-ring auth-card">
        <h1>Create account</h1>
        <p class="sub">Start forging quizzes in seconds</p>

        <div class="error-box hidden" id="errorBox"></div>

        <form id="signupForm">
          <label for="email">Email</label>
          <div class="field">
            <input
              type="email"
              id="email"
              required
              placeholder="you@example.com"
            />
          </div>

          <label for="password">Password</label>
          <div class="field">
            <input
              type="password"
              id="password"
              required
              minlength="10"
              placeholder="At least 10 characters"
            />
            <button type="button" class="toggle-pass" data-target="password">
              Show
            </button>
          </div>

          <ul class="reqs">
            <li id="req-len">At least 10 characters</li>
          </ul>

          <label for="confirm">Confirm password</label>
          <div class="field">
            <input
              type="password"
              id="confirm"
              required
              minlength="10"
              placeholder="Re-enter password"
            />
            <button type="button" class="toggle-pass" data-target="confirm">
              Show
            </button>
          </div>
          <p class="match-msg" id="matchMsg">Passwords must match</p>

          <button type="submit" class="gen-btn" id="submitBtn" disabled>
            Sign up
          </button>
        </form>

        <p class="switch">
          Already have an account? <a href="/login">Log in</a>
        </p>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
      if (Auth.getToken()) window.location.replace("/");

      const errorBox = document.getElementById("errorBox");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirm");
      const matchMsg = document.getElementById("matchMsg");
      const submitBtn = document.getElementById("submitBtn");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("hidden");
      }

      document.querySelectorAll(".toggle-pass").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = document.getElementById(btn.dataset.target);
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          btn.textContent = show ? "Hide" : "Show";
        });
      });

      function validate() {
        const password = passwordInput.value;
        const confirm = confirmInput.value;

        const longEnough = password.length >= 10;
        document.getElementById("req-len").classList.toggle("ok", longEnough);

        const matches = confirm.length > 0 && password === confirm;
        if (!confirm) {
          matchMsg.textContent = "Passwords must match";
          matchMsg.className = "match-msg";
        } else if (matches) {
          matchMsg.textContent = "Passwords match";
          matchMsg.className = "match-msg ok";
        } else {
          matchMsg.textContent = "Passwords do not match";
          matchMsg.className = "match-msg bad";
        }

        submitBtn.disabled = !(longEnough && matches);
        return longEnough && matches;
      }

      passwordInput.addEventListener("input", validate);
      confirmInput.addEventListener("input", validate);

      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          errorBox.classList.add("hidden");
          if (!validate()) return;

          const email = document.getElementById("email").value.trim();
          const password = passwordInput.value;

          try {
            const res = await fetch("/api/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Signup failed");

            Auth.setAuth(data.token, data.user);
            window.location.replace("/");
          } catch (err) {
            showError(err.message || "Signup failed");
          }
        });
    </script>
  </body>
</html>
