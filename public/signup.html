<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up · QuizForge</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      .auth-wrap {
        max-width: 420px;
        margin: 4rem auto;
        padding: 0 1.25rem;
      }
      .auth-card {
        padding: 2rem;
      }
      .auth-card h1 {
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .auth-card p.sub {
        text-align: center;
        color: rgba(255, 255, 255, 0.55);
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
      }
      .auth-card label {
        display: block;
        font-size: 0.8rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 0.35rem;
      }
      .field {
        position: relative;
        margin-bottom: 1rem;
      }
      .auth-card input {
        width: 100%;
        padding: 0.85rem 2.75rem 0.85rem 1rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(0, 0, 0, 0.3);
        color: white;
        font-size: 0.95rem;
      }
      .auth-card input:focus {
        outline: none;
        border-color: #a78bfa;
      }
      .toggle-pass {
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.55);
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 700;
      }
      .reqs {
        list-style: none;
        padding: 0;
        margin: 0 0 1rem;
        font-size: 0.8rem;
      }
      .reqs li {
        margin: 0.3rem 0;
        color: rgba(255, 255, 255, 0.45);
      }
      .reqs li.ok {
        color: #4ade80;
      }
      .reqs li.ok::before {
        content: "✓ ";
      }
      .reqs li:not(.ok)::before {
        content: "○ ";
      }
      .match-msg {
        font-size: 0.8rem;
        margin: -0.5rem 0 1rem;
        color: rgba(255, 255, 255, 0.45);
      }
      .match-msg.ok {
        color: #4ade80;
      }
      .match-msg.bad {
        color: #fb7185;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 1.25rem 0;
        color: rgba(255, 255, 255, 0.35);
        font-size: 0.8rem;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.12);
      }
      .switch {
        text-align: center;
        margin-top: 1.25rem;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.55);
      }
      .switch a {
        color: #67e8f9;
        text-decoration: none;
        font-weight: 700;
      }
      .error-box {
        margin-bottom: 1rem;
        color: #fb7185;
        font-size: 0.85rem;
      }
      .google-btn {
        width: 100%;
        padding: 0.85rem 1rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      .gen-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="aurora"></div>
    <div class="auth-wrap">
      <div class="glass glow-ring auth-card">
        <h1>Create account</h1>
        <p class="sub">Start forging quizzes in seconds</p>

        <button type="button" class="google-btn" id="googleBtn">
          Sign up with Google
        </button>

        <div class="divider">or</div>

        <div class="error-box hidden" id="errorBox"></div>

        <form id="signupForm">
          <label for="email">Email</label>
          <div class="field">
            <input
              type="email"
              id="email"
              required
              placeholder="you@example.com"
            />
          </div>

          <label for="password">Password</label>
          <div class="field">
            <input
              type="password"
              id="password"
              required
              minlength="6"
              placeholder="Create a strong password"
            />
            <button type="button" class="toggle-pass" data-target="password">
              Show
            </button>
          </div>

          <ul class="reqs" id="reqs">
            <li id="req-len">At least 6 characters</li>
            <li id="req-upper">One uppercase letter (A–Z)</li>
            <li id="req-special">One symbol (!@#$%...)</li>
          </ul>

          <label for="confirm">Confirm password</label>
          <div class="field">
            <input
              type="password"
              id="confirm"
              required
              minlength="6"
              placeholder="Re-enter password"
            />
            <button type="button" class="toggle-pass" data-target="confirm">
              Show
            </button>
          </div>
          <p class="match-msg" id="matchMsg">Passwords must match</p>

          <button type="submit" class="gen-btn" id="submitBtn" disabled>
            Sign up
          </button>
        </form>

        <p class="switch">
          Already have an account? <a href="/login">Log in</a>
        </p>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script src="/js/auth.js"></script>
    <script>
      if (Auth.getToken()) window.location.href = "/";

      firebase.initializeApp(window.FIREBASE_CONFIG);
      const auth = firebase.auth();
      window.firebaseAuth = auth;

      const errorBox = document.getElementById("errorBox");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirm");
      const matchMsg = document.getElementById("matchMsg");
      const submitBtn = document.getElementById("submitBtn");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove("hidden");
      }

      // Reveal password buttons
      document.querySelectorAll(".toggle-pass").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = document.getElementById(btn.dataset.target);
          const hidden = input.type === "password";
          input.type = hidden ? "text" : "password";
          btn.textContent = hidden ? "Hide" : "Show";
        });
      });

      function validatePassword() {
        const value = passwordInput.value;
        const confirm = confirmInput.value;

        const checks = {
          len: value.length >= 6,
          upper: /[A-Z]/.test(value),
          special: /[^A-Za-z0-9]/.test(value),
        };

        document.getElementById("req-len").classList.toggle("ok", checks.len);
        document
          .getElementById("req-upper")
          .classList.toggle("ok", checks.upper);
        document
          .getElementById("req-special")
          .classList.toggle("ok", checks.special);

        const allReqs = checks.len && checks.upper && checks.special;
        const matches = confirm.length > 0 && value === confirm;

        if (!confirm) {
          matchMsg.textContent = "Passwords must match";
          matchMsg.className = "match-msg";
        } else if (matches) {
          matchMsg.textContent = "Passwords match";
          matchMsg.className = "match-msg ok";
        } else {
          matchMsg.textContent = "Passwords do not match";
          matchMsg.className = "match-msg bad";
        }

        submitBtn.disabled = !(allReqs && matches);
        return allReqs && matches;
      }

      passwordInput.addEventListener("input", validatePassword);
      confirmInput.addEventListener("input", validatePassword);

      // Email/password signup
      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          errorBox.classList.add("hidden");

          if (!validatePassword()) {
            showError("Please meet all password requirements.");
            return;
          }

          const email = document.getElementById("email").value.trim();
          const password = passwordInput.value;

          try {
            const cred = await auth.createUserWithEmailAndPassword(
              email,
              password,
            );
            const idToken = await cred.user.getIdToken();
            await Auth.exchangeFirebaseToken(idToken);
            window.location.href = "/";
          } catch (err) {
            if (err.code === "auth/password-does-not-meet-requirements") {
              showError(
                "Password must include an uppercase letter and a symbol (e.g. Test123!)",
              );
            } else if (err.code === "auth/email-already-in-use") {
              showError("That email is already registered. Try logging in.");
            } else {
              showError(err.message || "Signup failed");
            }
          }
        });

      // Google signup/login
      // Google login/signup via redirect (more reliable)
      document
        .getElementById("googleBtn")
        .addEventListener("click", async () => {
          errorBox.classList.add("hidden");
          try {
            const provider = new firebase.auth.GoogleAuthProvider();
            await auth.signInWithRedirect(provider);
          } catch (err) {
            showError(err.message || "Google login failed");
          }
        });

      // Handle result after redirect returns
      auth
        .getRedirectResult()
        .then(async (result) => {
          if (!result || !result.user) return;
          const idToken = await result.user.getIdToken();
          await Auth.exchangeFirebaseToken(idToken);
          window.location.href = "/";
        })
        .catch((err) => {
          if (err.code !== "auth/popup-closed-by-user") {
            showError(err.message || "Google login failed");
          }
        });
    </script>
  </body>
</html>
